# Single-host deployment of one release: API and Worker roles from the same
# image. Build the release first (cicd_scripts/build.sh), then `docker compose
# build`. PostgreSQL is external; provide TEAMEVOLVER_PG_DSN and the Root Key
# through deploy/.env (not committed).
x-teamevolver: &teamevolver
  image: "${TEAMEVOLVER_IMAGE:-teamevolver:latest}"
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  env_file:
    - path: deploy/.env
      required: false
  environment: &teamevolver-env
    TZ: Asia/Shanghai
    OPENVIKING_CLI_BIN: "${OPENVIKING_CLI_BIN:-/usr/local/bin/ov}"

services:
  teamevolver-api:
    <<: *teamevolver
    container_name: teamevolver-api
    ports:
      - "${TEAMEVOLVER_PORT:-52010}:52010"
    environment:
      <<: *teamevolver-env
      TEAMEVOLVER_ROLE: api
      TEAMEVOLVER_PORT: "52010"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:52010/readyz', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  teamevolver-worker:
    <<: *teamevolver
    container_name: teamevolver-worker
    environment:
      <<: *teamevolver-env
      TEAMEVOLVER_ROLE: worker
      TEAMEVOLVER_PORT: "52011"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:52011/readyz', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
