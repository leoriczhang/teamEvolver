[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "teamEvolver"
version = "0.1.0"
description = "teamEvolver: standalone multi-file team skill evolution, validation, and synchronization."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "teamEvolver Contributors" },
]
keywords = ["skills", "agents", "skill-library", "validation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "httpx>=0.25.0",
    "json-repair>=0.44.0",
    "openai>=1.0",
    "tiktoken>=0.5",
]

[project.optional-dependencies]
sharing = [
    "boto3>=1.28",
]
mining = [
    "hermes-agent==0.19.0",
]
validation = [
    "openai>=1.0",
]
truereplay = [
    "hermes-agent==0.19.0",
    "openai>=1.0",
]
dev = [
    "pytest>=8.0",
    "anyio>=4.0",
]
all = [
    "teamEvolver[sharing,mining,validation,truereplay]",
]

[project.urls]
Homepage = "https://github.com/leoriczhang/teamEvolver"
Repository = "https://github.com/leoriczhang/teamEvolver"
Issues = "https://github.com/leoriczhang/teamEvolver/issues"

[project.scripts]
teamEvolver = "teamEvolver.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["teamEvolver*"]

[tool.setuptools.package-data]
teamEvolver = [
    "web/*.html",
    "web/dist/*.html",
    "web/dist/assets/*",
    "integrations/hermes_skill/*",
    "integrations/hermes_skill_sync/*",
    "skillminer/*.md",
    "skillminer/*.py",
    "skillminer/.env.example",
    "skillminer/*.sh",
    "skillminer/hermes/*",
    "skillminer/data/input/.gitkeep",
    "skillminer/web_console/*.py",
    "skillminer/web_console/static/*",
    "skillminer/*-agent-skill/*.md",
    "skillminer/*-agent-skill/assets/*",
    "skillminer/*-agent-skill/references/*",
    "skillminer/*-agent-skill/scripts/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E731", "F403", "F405"]

[tool.ruff.lint.per-file-ignores]
"teamEvolver/skillminer/*_prompt.py" = ["E501"]
