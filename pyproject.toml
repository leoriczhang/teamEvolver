[build-system]
requires = ["setuptools>=77,<85", "wheel>=0.41,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "teamEvolver"
version = "0.1.0"
description = "teamEvolver: standalone multi-file team skill evolution, validation, and synchronization."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "teamEvolver Contributors" },
]
keywords = ["skills", "agents", "skill-library", "validation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "httpx>=0.25.0",
    "asyncpg>=0.29.0",
    "json-repair>=0.44.0",
    "langfuse>=4.14,<5.0",
    "openai>=1.0,<3",
    "openpyxl>=3.1",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "anyio>=4.0",
    "ruff>=0.6",
    "build>=1.2",
]

[project.scripts]
teamEvolver = "teamEvolver.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["teamEvolver*", "team_skills*", "session_ingestion*", "team_memory*", "team_miner*", "team_replay*"]
exclude = ["tests*", "team_miner.frontend*", "team_skills.frontend*"]

[tool.setuptools.package-data]
team_memory = ["README.md"]
team_replay = ["README.md"]
"session_ingestion" = ["README.md"]
"session_ingestion.adapters" = ["*.py", "README.md"]
"session_ingestion.adapters._shared" = ["*.md"]
teamEvolver = [
    "web/*.html",
    "web/dist/*.html",
    "web/dist/assets/*",
    "database/schema/*.sql",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: requires an isolated PostgreSQL database",
    "external: depends on another repository or external integration",
    "e2e: exercises a complete application workflow",
]


[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E731", "F403", "F405"]
