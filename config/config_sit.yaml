# teamEvolver SIT 环境配置（云平台）
# 用途：部署到公司云（SIT）时由平台挂载为服务的唯一真源配置，
#       控制台页面修改配置会直接写回挂载的文件。
# 环境分工：本地=config.yaml；SIT=本文件；生产=config_prd.yaml（规划中，同结构）。
# 密钥分离：敏感凭证（API Key、Secret Key）已移至 .env_sit，由 ConfigStore 启动时注入。
# 云上服务对外地址：http://team-evolver.intsit.sfcloud.local:1080/
# 本文件为稀疏覆盖：未列出的配置项使用代码内置默认值；控制台可管理的调优项不在此列。

team:
  display_name: "inc-aiagent"

llm:
  api_base: "http://llm-model-hub-proxy.sit.sf-express.com/v1"
  # 必填凭证由 .env_sit 的 TEAMEVOLVER_LLM_API_KEY 注入；缺失会使 Skill Evolution 失败。
  # 容器挂载 /app/deploy/.env；直接运行指定 TEAMEVOLVER_ENV_FILE 的绝对路径。

service:
  self_registration_enabled: true  # SIT 允许网页自主注册
  host: 0.0.0.0
  port: 1080                    # 云上端口 1080，对外由平台路由到 team-evolver.intsit.sfcloud.local:1080

sharing:
  viking_deployment: local
  viking_endpoint: "http://openviking.intsit.sfcloud.local:1080"
  # Trusted 模式只读取 TEAMEVOLVER_OV_API_KEY。
  viking_account: "product_agent"
  viking_user: "team"

# PostgreSQL 本地状态存储（多租户 session/skill 存储；启用后强制 postgres
# 后端并关闭 viking 本地回退）。dsn 留空：由挂载的 /app/deploy/.env
# （TEAMEVOLVER_PG_*）派生，container_start.sh 做必填校验。
storage_pg:
  enabled: true
  schema: teamevolver

evolve:
  server_url: "http://127.0.0.1:1080"

langfuse:
  tracing_enabled: false
  tracing_host: ""
  # tracing_public_key / tracing_secret_key 由 .env_sit 中 TEAMEVOLVER_LANGFUSE_TRACING_PUBLIC_KEY / TEAMEVOLVER_LANGFUSE_TRACING_SECRET_KEY 注入

# KEE R6：结构与方法治理由 TE 承载，OV 仅提供通用内容、ACL、检索和索引。
# 模型继承 TE 租户有效 llm；无需在 OV 安装 Ontology 编译 Skill。
# 升级前须排空旧任务、迁移干跑并核验账户 ACL；不在部署中自动迁移历史。
compile:
  executor: internal
ontology:
  enabled: true
  state_dir: "/app/deploy/logs/ontology"
  queue_limit: 32
  allow_fixture: false
  # 旧 OV Compile 任务的查询与恢复配置；新 KEE 任务使用内部 Worker。
  compile_skill_uri: "viking://agent/skills/ontology-extraction-v1"
  compile_workspace_uri: "viking://resources/te_ontology_compile"
  compile_user: "te-ontology-compiler"
  compile_deadline:
    base_seconds: 1800        # 固定成本：抽取地板(~1000s) + 父流程(~500s) + 零头
    wave_seconds: 4500        # 每个抽取波次（6 批并行，单满批实测 ~4100s）
    merge_wave_seconds: 1800  # 每个合并波次（10 并发）
    safety_factor: 1.5        # 吞吐波动余量（实测 50-60 tok/s）
  compile_model_revision: ""  # OV 模型配置修订号；留空禁用跨任务缓存
  model: {}  # 可选覆盖，否则继承 TE llm
  kee_query_enabled: false # 不注册 MCP；不参与业务执行授权
  kee_max_model_calls: 64
  kee_compile_deadline_seconds: 480
  source_max_files: 1000
  source_max_depth: 20
  source_max_entries: 10000
  source_max_bytes: 20971520
  source_max_file_bytes: 2097152

# 服务级日志：目录自动创建；配置更改需重启。任务制品仍由 ontology.state_dir 管理。
logging:
  level: INFO
  console_enabled: true
  file_enabled: true
  directory: /app/deploy/logs
  max_file_mb: 100
  retention_days: 14
  max_total_mb: 2048

# 成功经验同步到 OV 可配置资源目录；复用 storage_pg 与 sharing 配置。
experience_sync:
  enabled: true
  target_directory: viking://resources/agent_knowledge_workspace/input/proven_experiences
  interval_seconds: 30
  batch_size: 100
  full_scan_interval_seconds: 86400
  import_max_source_mb: 64
