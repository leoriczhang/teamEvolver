team:
  display_name: inc-aiagent
llm:
  api_base: http://llm-model-hub-proxy.sit.sf-express.com/v1
  api_key: ""
service:
  self_registration_enabled: true
  host: 0.0.0.0
  port: 52010
sharing:
  viking_deployment: local
  viking_endpoint: http://openviking.intsit.sfcloud.local:1080
  viking_api_key: ""
  viking_account: default
  viking_user: team
storage_pg:
  enabled: true
  schema: teamevolver
evolve:
  server_url: http://127.0.0.1:52010
ontology:
  enabled: true
  state_dir: ''
  queue_limit: 32
  allow_fixture: false
  compile_skill_uri: viking://agent/skills/ontology-extraction-v1
  compile_workspace_uri: viking://resources/te_ontology_compile
  compile_user: te-ontology-compiler
  compile_deadline:
    base_seconds: 1800
    wave_seconds: 4500
    merge_wave_seconds: 1800
    safety_factor: 1.5
  compile_model_revision: ''
  source_max_files: 1000
  source_max_depth: 20
  source_max_entries: 10000
  source_max_bytes: 20971520
  source_max_file_bytes: 2097152
logging:
  level: INFO
  console_enabled: true
  file_enabled: true
  directory: ~/.teamEvolver
  max_file_mb: 100
  retention_days: 14
  max_total_mb: 2048
experience_sync:
  enabled: false
  target_directory: viking://resources/agent_knowledge_workspace/input/proven_experiences
  interval_seconds: 30
  batch_size: 100
  full_scan_interval_seconds: 86400
  import_max_source_mb: 64
