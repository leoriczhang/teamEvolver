# Merge with the existing service configuration; no credentials in this file.
# This template is disabled until PG, model, ACL and recovery acceptance pass.
compile:
  executor: internal
ontology:
  enabled: false
  allow_fixture: false
  model: {}
  state_dir: /app/deploy/logs/ontology
  kee_query_enabled: false
  kee_max_model_calls: 64
  kee_compile_deadline_seconds: 480
logging:
  file_enabled: true
  console_enabled: true
  directory: /app/deploy/logs
  level: INFO
  max_file_mb: 100
  retention_days: 14
  max_total_mb: 2048
